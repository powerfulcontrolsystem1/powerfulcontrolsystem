map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;
    types {
        text/html html htm;
        text/css css;
        application/javascript js;
        application/json json;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        image/gif gif;
        image/x-icon ico;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_pass http://backend:8080;
    }

    location ~* ^/(login|login_usuario|accept|registrar_nuevo_usuario_administrador|registrar_contrasena_usuario_de_google)\.html$ {
        include /etc/nginx/conf.d/pcs-static-security-headers.inc;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri @backend;
    }

    location ~* ^/js/(login|login_usuario|recaptcha_helper|registrar_nuevo_usuario_administrador|registrar_contrasena_usuario_de_google)\.js$ {
        include /etc/nginx/conf.d/pcs-static-security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # Legacy enterprise attachments are never served directly. New uploads live
    # outside the web root and are downloaded through authenticated API handlers.
    location ~* ^/uploads/(chat_tareas|comprobantes|soportes_compras_ia)/ {
        include /etc/nginx/conf.d/pcs-static-security-headers.inc;
        return 404;
    }

    location ~* ^/uploads/empresas/empresa_[0-9]+/(mensajeria/buzon|imagenes/grafologia)/ {
        include /etc/nginx/conf.d/pcs-static-security-headers.inc;
        return 404;
    }

    location ~* ^/uploads/empresas/empresa_[^/]+/facturacion_electronica/ {
        include /etc/nginx/conf.d/pcs-static-security-headers.inc;
        return 404;
    }

    # Solo instaladores de RustDesk pueden ser publicos. Adjuntos, exportaciones
    # y documentos empresariales se sirven por handlers autenticados del backend.
    location ~ ^/descargas/(rustdesk-cliente-windows-x64\.exe|rustdesk-cliente-linux-amd64\.deb|rustdesk-cliente-macos-x64\.dmg|rustdesk-servidor-windows-x64\.zip|rustdesk-servidor-linux-amd64\.zip)$ {
        include /etc/nginx/conf.d/pcs-static-security-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    location /descargas/ {
        include /etc/nginx/conf.d/pcs-static-security-headers.inc;
        return 404;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://backend:8080;
    }

    location /super/api/ {
        proxy_pass http://backend:8080;
    }

    location /auth/ {
        proxy_pass http://backend:8080;
    }

    location /epayco/ {
        proxy_pass http://backend:8080;
    }

    location /wompi/ {
        proxy_pass http://backend:8080;
    }

    location /generate {
        proxy_pass http://backend:8080;
    }

    location /download {
        proxy_pass http://backend:8080;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://backend:8080;
    }

    location = / {
        include /etc/nginx/conf.d/pcs-static-security-headers.inc;
        try_files /index.html =404;
    }

    location / {
        include /etc/nginx/conf.d/pcs-static-security-headers.inc;
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://backend:8080;
    }
}
