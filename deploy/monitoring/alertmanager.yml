global:
  resolve_timeout: 5m

# El receptor inicial es deliberadamente interno: permite validar el circuito
# Prometheus -> Alertmanager sin enviar correo o webhooks externos. La entrega
# a responsables se habilita solo con un canal y runbook aprobados.
route:
  receiver: observabilidad-interna
  group_by: [alertname, service, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: observabilidad-interna
