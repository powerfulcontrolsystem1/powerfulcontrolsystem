<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
  <title id="title">Conector GPIO de 40 pines de Raspberry Pi, numeración física y BCM</title>
  <desc id="desc">Diagrama de las veinte filas del conector GPIO. Los pines impares están a la izquierda y los pares a la derecha.</desc>
  <defs>
    <style>
      .bg{fill:#f5f8fb}.board{fill:#177b58;stroke:#0d563e;stroke-width:6}.head{font:700 34px system-ui,sans-serif;fill:#142033}.sub{font:20px system-ui,sans-serif;fill:#415169}.label{font:700 20px ui-monospace,monospace;fill:#142033}.pin{stroke:#fff;stroke-width:3}.gpio{fill:#f4c542}.power5{fill:#e85d5d}.power3{fill:#e78ac3}.ground{fill:#243042}.legend{font:18px system-ui,sans-serif;fill:#243042}.num{font:700 15px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.side{font:700 16px system-ui,sans-serif;fill:#dff7ed;text-anchor:middle}.note{font:18px system-ui,sans-serif;fill:#415169}
    </style>
  </defs>
  <rect class="bg" width="1200" height="1050" rx="28"/>
  <text class="head" x="600" y="55" text-anchor="middle">Raspberry Pi · Conector GPIO de 40 pines</text>
  <text class="sub" x="600" y="88" text-anchor="middle">Numeración física + GPIO BCM (vista superior, USB/Ethernet hacia abajo)</text>
  <rect class="board" x="390" y="120" width="420" height="790" rx="36"/>
  <text class="side" x="600" y="153">BORDE DE LA PLACA</text>
  <text class="side" x="600" y="887">USB / ETHERNET</text>

  <g>
    <circle class="pin power3" cx="540" cy="185" r="16"/><text class="num" x="540" y="185">1</text><text class="label" x="505" y="192" text-anchor="end">3V3</text>
    <circle class="pin power5" cx="660" cy="185" r="16"/><text class="num" x="660" y="185">2</text><text class="label" x="695" y="192">5V</text>
    <circle class="pin gpio" cx="540" cy="218" r="16"/><text class="num" x="540" y="218">3</text><text class="label" x="505" y="225" text-anchor="end">GPIO2 · SDA1</text>
    <circle class="pin power5" cx="660" cy="218" r="16"/><text class="num" x="660" y="218">4</text><text class="label" x="695" y="225">5V</text>
    <circle class="pin gpio" cx="540" cy="251" r="16"/><text class="num" x="540" y="251">5</text><text class="label" x="505" y="258" text-anchor="end">GPIO3 · SCL1</text>
    <circle class="pin ground" cx="660" cy="251" r="16"/><text class="num" x="660" y="251">6</text><text class="label" x="695" y="258">GND</text>
    <circle class="pin gpio" cx="540" cy="284" r="16"/><text class="num" x="540" y="284">7</text><text class="label" x="505" y="291" text-anchor="end">GPIO4</text>
    <circle class="pin gpio" cx="660" cy="284" r="16"/><text class="num" x="660" y="284">8</text><text class="label" x="695" y="291">GPIO14 · TXD</text>
    <circle class="pin ground" cx="540" cy="317" r="16"/><text class="num" x="540" y="317">9</text><text class="label" x="505" y="324" text-anchor="end">GND</text>
    <circle class="pin gpio" cx="660" cy="317" r="16"/><text class="num" x="660" y="317">10</text><text class="label" x="695" y="324">GPIO15 · RXD</text>
    <circle class="pin gpio" cx="540" cy="350" r="16"/><text class="num" x="540" y="350">11</text><text class="label" x="505" y="357" text-anchor="end">GPIO17</text>
    <circle class="pin gpio" cx="660" cy="350" r="16"/><text class="num" x="660" y="350">12</text><text class="label" x="695" y="357">GPIO18 · PWM0</text>
    <circle class="pin gpio" cx="540" cy="383" r="16"/><text class="num" x="540" y="383">13</text><text class="label" x="505" y="390" text-anchor="end">GPIO27</text>
    <circle class="pin ground" cx="660" cy="383" r="16"/><text class="num" x="660" y="383">14</text><text class="label" x="695" y="390">GND</text>
    <circle class="pin gpio" cx="540" cy="416" r="16"/><text class="num" x="540" y="416">15</text><text class="label" x="505" y="423" text-anchor="end">GPIO22</text>
    <circle class="pin gpio" cx="660" cy="416" r="16"/><text class="num" x="660" y="416">16</text><text class="label" x="695" y="423">GPIO23</text>
    <circle class="pin power3" cx="540" cy="449" r="16"/><text class="num" x="540" y="449">17</text><text class="label" x="505" y="456" text-anchor="end">3V3</text>
    <circle class="pin gpio" cx="660" cy="449" r="16"/><text class="num" x="660" y="449">18</text><text class="label" x="695" y="456">GPIO24</text>
    <circle class="pin gpio" cx="540" cy="482" r="16"/><text class="num" x="540" y="482">19</text><text class="label" x="505" y="489" text-anchor="end">GPIO10 · MOSI</text>
    <circle class="pin ground" cx="660" cy="482" r="16"/><text class="num" x="660" y="482">20</text><text class="label" x="695" y="489">GND</text>
    <circle class="pin gpio" cx="540" cy="515" r="16"/><text class="num" x="540" y="515">21</text><text class="label" x="505" y="522" text-anchor="end">GPIO9 · MISO</text>
    <circle class="pin gpio" cx="660" cy="515" r="16"/><text class="num" x="660" y="515">22</text><text class="label" x="695" y="522">GPIO25</text>
    <circle class="pin gpio" cx="540" cy="548" r="16"/><text class="num" x="540" y="548">23</text><text class="label" x="505" y="555" text-anchor="end">GPIO11 · SCLK</text>
    <circle class="pin gpio" cx="660" cy="548" r="16"/><text class="num" x="660" y="548">24</text><text class="label" x="695" y="555">GPIO8 · CE0</text>
    <circle class="pin ground" cx="540" cy="581" r="16"/><text class="num" x="540" y="581">25</text><text class="label" x="505" y="588" text-anchor="end">GND</text>
    <circle class="pin gpio" cx="660" cy="581" r="16"/><text class="num" x="660" y="581">26</text><text class="label" x="695" y="588">GPIO7 · CE1</text>
    <circle class="pin gpio" cx="540" cy="614" r="16"/><text class="num" x="540" y="614">27</text><text class="label" x="505" y="621" text-anchor="end">GPIO0 · ID_SD</text>
    <circle class="pin gpio" cx="660" cy="614" r="16"/><text class="num" x="660" y="614">28</text><text class="label" x="695" y="621">GPIO1 · ID_SC</text>
    <circle class="pin gpio" cx="540" cy="647" r="16"/><text class="num" x="540" y="647">29</text><text class="label" x="505" y="654" text-anchor="end">GPIO5</text>
    <circle class="pin ground" cx="660" cy="647" r="16"/><text class="num" x="660" y="647">30</text><text class="label" x="695" y="654">GND</text>
    <circle class="pin gpio" cx="540" cy="680" r="16"/><text class="num" x="540" y="680">31</text><text class="label" x="505" y="687" text-anchor="end">GPIO6</text>
    <circle class="pin gpio" cx="660" cy="680" r="16"/><text class="num" x="660" y="680">32</text><text class="label" x="695" y="687">GPIO12 · PWM0</text>
    <circle class="pin gpio" cx="540" cy="713" r="16"/><text class="num" x="540" y="713">33</text><text class="label" x="505" y="720" text-anchor="end">GPIO13 · PWM1</text>
    <circle class="pin ground" cx="660" cy="713" r="16"/><text class="num" x="660" y="713">34</text><text class="label" x="695" y="720">GND</text>
    <circle class="pin gpio" cx="540" cy="746" r="16"/><text class="num" x="540" y="746">35</text><text class="label" x="505" y="753" text-anchor="end">GPIO19 · PCM_FS</text>
    <circle class="pin gpio" cx="660" cy="746" r="16"/><text class="num" x="660" y="746">36</text><text class="label" x="695" y="753">GPIO16</text>
    <circle class="pin gpio" cx="540" cy="779" r="16"/><text class="num" x="540" y="779">37</text><text class="label" x="505" y="786" text-anchor="end">GPIO26</text>
    <circle class="pin gpio" cx="660" cy="779" r="16"/><text class="num" x="660" y="779">38</text><text class="label" x="695" y="786">GPIO20 · PCM_DIN</text>
    <circle class="pin ground" cx="540" cy="812" r="16"/><text class="num" x="540" y="812">39</text><text class="label" x="505" y="819" text-anchor="end">GND</text>
    <circle class="pin gpio" cx="660" cy="812" r="16"/><text class="num" x="660" y="812">40</text><text class="label" x="695" y="819">GPIO21 · PCM_DOUT</text>
  </g>
  <g transform="translate(225 955)"><circle class="gpio" cx="0" cy="0" r="13"/><text class="legend" x="22" y="6">GPIO BCM</text><circle class="power5" cx="190" cy="0" r="13"/><text class="legend" x="212" y="6">5 V</text><circle class="power3" cx="305" cy="0" r="13"/><text class="legend" x="327" y="6">3,3 V</text><circle class="ground" cx="455" cy="0" r="13"/><text class="legend" x="477" y="6">Tierra</text></g>
  <text class="note" x="600" y="1010" text-anchor="middle">PCS configura por número BCM. GPIO0 y GPIO1 suelen reservarse para identificación HAT.</text>
</svg>
