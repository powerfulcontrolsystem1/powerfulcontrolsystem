<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Equipos electrónicos de estación</title>
  <link rel="stylesheet" href="/estilos.css">
  <style>
    :root {
      --cart-electric-panel: var(--card);
      --cart-electric-soft: var(--surface-soft);
      --cart-electric-text: var(--text);
      --cart-electric-muted: var(--muted);
      --cart-electric-line: var(--border);
      --cart-electric-success: var(--success);
      --cart-electric-danger: var(--danger);
      --cart-electric-shadow: color-mix(in srgb, #020617 18%, transparent);
    }

    body.cart-electric-page {
      margin: 0;
      background: linear-gradient(180deg, var(--bg-alt), var(--bg));
      color: var(--cart-electric-text);
    }

    .cart-electric-shell {
      max-width: 1320px;
      margin: 0 auto;
      padding: 22px;
    }

    .cart-electric-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--cart-electric-line);
    }

    .cart-electric-header h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.35rem);
      letter-spacing: 0;
      line-height: 1.1;
    }

    .cart-electric-meta {
      margin: 7px 0 0;
      color: var(--cart-electric-muted);
      line-height: 1.45;
    }

    .cart-electric-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .cart-electric-summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .cart-electric-kpi,
    .device-card,
    .sensor-card {
      border: 1px solid var(--cart-electric-line);
      border-radius: 8px;
      background: var(--cart-electric-panel);
      box-shadow: 0 10px 22px var(--cart-electric-shadow);
    }

    .cart-electric-kpi {
      padding: 13px;
      min-height: 74px;
    }

    .cart-electric-kpi small {
      display: block;
      color: var(--cart-electric-muted);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .cart-electric-kpi strong {
      display: block;
      font-size: 1.35rem;
      line-height: 1.1;
    }

    .device-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 8px;
    }

    .device-card {
      min-width: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: 1fr auto;
      position: relative;
      transition: background-color .18s ease, border-color .18s ease, box-shadow .18s ease;
      touch-action: manipulation;
    }

    .device-card.is-on {
      background: color-mix(in srgb, var(--cart-electric-success) 9%, var(--cart-electric-panel));
      border-color: color-mix(in srgb, var(--cart-electric-success) 38%, var(--cart-electric-line));
    }

    .sensor-card {
      min-width: 0;
      padding: 14px;
      display: grid;
      gap: 10px;
      align-content: start;
      border-left: 4px solid var(--cart-electric-muted);
    }

    .sensor-card.is-active { border-left-color: var(--cart-electric-success); }
    .sensor-card.is-error { border-left-color: var(--cart-electric-danger); }
    .sensor-card .device-title-row { align-items: center; }

    .controller-summary {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 14px;
    }

    .controller-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--cart-electric-line);
      border-radius: 999px;
      padding: 7px 10px;
      background: var(--cart-electric-panel);
      color: var(--cart-electric-muted);
      font-size: .82rem;
      font-weight: 750;
    }

    .controller-chip::before {
      content: '';
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cart-electric-muted);
    }

    .controller-chip.is-online { color: var(--cart-electric-success); }
    .controller-chip.is-online::before { background: var(--cart-electric-success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cart-electric-success) 18%, transparent); }

    .device-photo {
      position: static;
      width: 42px;
      height: 42px;
      object-fit: contain;
      padding: 4px;
      border: 1px solid var(--cart-electric-line);
      border-radius: 10px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--cart-electric-panel)), var(--cart-electric-soft));
      box-sizing: border-box;
      z-index: 1;
    }

    .device-photo-empty {
      display: none;
    }

    .device-body {
      padding: 9px 10px 2px;
      display: grid;
      gap: 6px;
    }

    .device-title-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      justify-content: space-between;
      align-items: flex-start;
      min-width: 0;
    }

    .device-title {
      min-width: 0;
    }

    .device-title strong {
      display: block;
      overflow-wrap: anywhere;
      white-space: normal;
      font-size: 1rem;
    }

    .device-schedule-state {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      color: var(--cart-electric-muted);
      font-size: .76rem;
      font-weight: 750;
      line-height: 1.25;
    }

    .device-schedule-state.is-running { color: var(--cart-electric-success); }
    .device-schedule-state::before { content: '◷'; font-size: .9rem; }

    .device-title small,
    .device-details {
      color: var(--cart-electric-muted);
      line-height: 1.45;
    }

    .device-details {
      display: grid;
      gap: 4px;
      font-size: .9rem;
    }

    .raspberry-connection {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .78rem;
      font-weight: 800;
    }

    .raspberry-connection-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      background: var(--cart-electric-danger);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--cart-electric-danger) 16%, transparent);
    }

    .raspberry-connection.is-online { color: var(--cart-electric-success); }
    .raspberry-connection.is-online .raspberry-connection-dot {
      background: var(--cart-electric-success);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--cart-electric-success) 16%, transparent);
    }
    .raspberry-connection.is-offline { color: var(--cart-electric-danger); }

    .device-footer {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;
      align-items: center;
      padding: 0 10px 10px;
    }
    .device-footer.has-photo { grid-template-columns: minmax(0, 1fr) 42px; }

    .device-footer .btn { grid-column: 1; width: 100%; min-height: 34px; }
    .device-footer .btn { position: relative; z-index: 2; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .device-footer.has-photo .device-photo { grid-column: 2; grid-row: 3; justify-self: end; }
    .device-toggle-action { font-weight: 800; }
    .device-toggle-action.is-on { background: var(--cart-electric-success); color: #fff; border-color: var(--cart-electric-success); }
    .device-toggle-action.is-off { background: var(--cart-electric-danger); color: #fff; border-color: var(--cart-electric-danger); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid var(--cart-electric-line);
      background: var(--cart-electric-soft);
      color: var(--cart-electric-text);
      font-size: .78rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .device-state-toggle { border: 0; cursor: pointer; font: inherit; }
    .device-state-toggle.is-on { background: var(--cart-electric-success); color: #fff; }
    .device-state-toggle.is-off { background: var(--cart-electric-danger); color: #fff; }
    .cart-electric-dialog { border: 0; border-radius: 16px; max-width: 520px; width: min(94vw, 520px); color: var(--cart-electric-text); background: var(--cart-electric-panel); box-shadow: 0 24px 80px var(--cart-electric-shadow); }
    .cart-electric-dialog::backdrop { background: rgb(2 6 23 / .62); }

    .status-pill.is-on {
      color: var(--cart-electric-success);
      border-color: color-mix(in srgb, var(--cart-electric-success) 38%, var(--cart-electric-line));
      background: color-mix(in srgb, var(--cart-electric-success) 13%, var(--cart-electric-soft));
    }

    .status-pill.is-off {
      color: var(--cart-electric-muted);
    }

    .status-pill.is-error {
      color: var(--cart-electric-danger);
      border-color: color-mix(in srgb, var(--cart-electric-danger) 34%, var(--cart-electric-line));
      background: color-mix(in srgb, var(--cart-electric-danger) 12%, var(--cart-electric-soft));
    }

    .cart-electric-message {
      margin: 0 0 12px;
    }

    @media (max-width: 760px) {
      .cart-electric-shell {
        padding: 14px;
      }

      .cart-electric-header {
        grid-template-columns: 1fr;
      }

      .cart-electric-actions {
        justify-content: flex-start;
      }

      .cart-electric-summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="/js/empresa_submenu_context.js"></script>
</head>
<body class="empresa-subpage cart-electric-page">
  <main class="cart-electric-shell">
    <header class="cart-electric-header">
      <div>
        <h1><span aria-hidden="true">⚡</span> Equipos electrónicos de estación</h1>
        <p id="cartElectricMeta" class="cart-electric-meta">Cargando estacion...</p>
      </div>
      <div class="cart-electric-actions">
        <label id="cartElectricStationFilterWrap" class="form-help" hidden>Ver estación
          <select id="cartElectricStationFilter" class="form-input"></select>
        </label>
        <button id="cartElectricRefreshBtn" class="btn secondary" type="button">Actualizar</button>
        <button id="cartElectricBackBtn" class="btn secondary" type="button">Volver</button>
      </div>
    </header>

    <section class="cart-electric-summary" aria-label="Resumen">
      <div class="cart-electric-kpi">
        <small>Aparatos</small>
        <strong id="cartElectricTotalDevices">0</strong>
      </div>
      <div class="cart-electric-kpi">
        <small>Raspberry conectadas</small>
        <strong id="cartElectricControllers">0 / 0</strong>
      </div>
      <div class="cart-electric-kpi">
        <small>Encendidos</small>
        <strong id="cartElectricOnDevices">0</strong>
      </div>
      <div class="cart-electric-kpi">
        <small>Programados</small>
        <strong id="cartElectricScheduledDevices">0</strong>
      </div>
      <div class="cart-electric-kpi">
        <small>Sensores</small>
        <strong id="cartElectricSensors">0</strong>
      </div>
    </section>

    <section id="cartElectricControllerSummary" class="controller-summary" aria-label="Controladores Raspberry"></section>
    <div id="cartElectricMessage" class="form-help cart-electric-message"></div>
    <section id="cartElectricGrid" class="device-grid" aria-live="polite"></section>

    <dialog id="cartElectricScheduleDialog" class="domotica-device-dialog cart-electric-dialog">
      <form method="dialog" id="cartElectricScheduleForm">
        <header class="domotica-device-head"><div><p class="form-help mt-0 mb-4">Programación</p><h2 id="cartElectricScheduleTitle" class="section-heading">Equipo</h2></div><button class="btn secondary" value="cancel">Cerrar</button></header>
        <div class="domotica-device-body">
          <label class="form-help inline-check"><input id="cartElectricScheduleEnabled" type="checkbox"> Activar programación</label>
          <div class="form-row"><div class="form-col"><label class="form-label" for="cartElectricScheduleOn">Encender (fecha y hora)</label><input id="cartElectricScheduleOn" class="form-input" type="datetime-local"></div><div class="form-col"><label class="form-label" for="cartElectricScheduleOff">Apagar (fecha y hora)</label><input id="cartElectricScheduleOff" class="form-input" type="datetime-local"></div></div>
          <label class="form-label" for="cartElectricScheduleDays">Días</label><select id="cartElectricScheduleDays" class="form-input"><option value="todos">Todos</option><option value="lunes_viernes">Lunes a viernes</option><option value="sabado_domingo">Sábado y domingo</option></select>
        </div>
        <footer class="domotica-device-footer"><button class="btn secondary" value="cancel">Cancelar</button><button id="cartElectricScheduleSave" class="btn primary" value="default">Guardar programación</button></footer>
      </form>
    </dialog>
    <dialog id="cartElectricTimerDialog" class="domotica-device-dialog cart-electric-dialog"><form method="dialog" id="cartElectricTimerForm"><header class="domotica-device-head"><div><p class="form-help mt-0 mb-4">Temporizador</p><h2 id="cartElectricTimerTitle" class="section-heading">Equipo</h2></div><button class="btn secondary" value="cancel">Cerrar</button></header><div class="domotica-device-body"><p class="form-help">Enciende el equipo y lo apaga automáticamente al finalizar.</p><div class="cart-electric-actions"><button class="btn secondary" type="button" data-timer-preset="900">15 minutos</button><button class="btn secondary" type="button" data-timer-preset="1800">30 minutos</button><button class="btn secondary" type="button" data-timer-preset="3600">1 hora</button></div><div class="form-row"><div class="form-col"><label class="form-label">Horas</label><input id="cartElectricTimerHours" class="form-input" type="number" min="0" max="168" value="0"></div><div class="form-col"><label class="form-label">Minutos</label><input id="cartElectricTimerMinutes" class="form-input" type="number" min="0" max="59" value="15"></div><div class="form-col"><label class="form-label">Segundos</label><input id="cartElectricTimerSeconds" class="form-input" type="number" min="0" max="59" value="0"></div></div></div><footer class="domotica-device-footer"><button class="btn secondary" value="cancel">Cancelar</button><button class="btn primary" value="default">Iniciar temporizador</button></footer></form></dialog>
  </main>

  <script>
    const state = {
      empresaID: 0,
      estacionID: 0,
      estacionNombre: '',
      carritoID: 0,
      carritoCodigo: '',
      config: null,
      reles: [],
      sensores: [],
      eventos: [],
      raspberryPIs: [],
      returnTo: '',
      allStations: false,
      stationFilterID: 0,
      sendingID: 0
	  , selectedReleID: 0, timers: JSON.parse(localStorage.getItem('pcsDomoticaTimers') || '{}')
    };

    function parsePositiveInt(raw) {
      const n = Number(String(raw == null ? '' : raw).trim());
      if (!Number.isFinite(n)) return 0;
      const out = Math.trunc(n);
      return out > 0 ? out : 0;
    }

    function normalize(raw) {
      return String(raw == null ? '' : raw).trim();
    }

	function timerInfo(releID) { const key=String(releID); const until=Number(state.timers[key]||0); const left=Math.max(0,Math.ceil((until-Date.now())/1000)); if(!left && until){ delete state.timers[key]; const rele=state.reles.find(function(item){return Number(item.id)===Number(releID);}); if(rele) rele.ultimo_estado='off'; localStorage.setItem('pcsDomoticaTimers',JSON.stringify(state.timers)); } return { active:left>0, left:left }; }
	function timerText(releID) { const info=timerInfo(releID); if(!info.active) return 'Temporizador'; const h=String(Math.floor(info.left/3600)).padStart(2,'0'),m=String(Math.floor(info.left%3600/60)).padStart(2,'0'),s=String(info.left%60).padStart(2,'0'); return h+' : '+m+' : '+s; }

    function escapeHtml(raw) {
      return normalize(raw)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function setMessage(text, type) {
      const box = document.getElementById('cartElectricMessage');
      if (!box) return;
      box.textContent = text || '';
      box.className = 'form-help cart-electric-message' + (type === 'error' ? ' error' : (type === 'success' ? ' success' : ''));
    }

    function buildCarritoURL() {
      const params = new URLSearchParams();
      if (state.empresaID) params.set('empresa_id', String(state.empresaID));
      if (state.estacionID) params.set('estacion_id', String(state.estacionID));
      if (state.estacionNombre) params.set('estacion_nombre', state.estacionNombre);
      if (state.carritoID) params.set('carrito_id', String(state.carritoID));
      if (state.carritoCodigo) params.set('carrito_codigo', state.carritoCodigo);
      return '/administrar_empresa/carrito_de_compras.html?' + params.toString();
    }

    function buildBackURL() {

      if (state.returnTo === 'admin') return '/administrar_empresa/panel.html?empresa_id=' + encodeURIComponent(state.empresaID);
      if (state.returnTo === 'estaciones') {
        return '/administrar_empresa/estaciones.html?empresa_id=' + encodeURIComponent(state.empresaID);
      }
      return buildCarritoURL();
    }

    function setMeta() {
      if (state.allStations) {
        document.getElementById('cartElectricMeta').textContent = 'Todos los equipos electrónicos de estaciones y habitaciones';
        return;
      }
      const parts = [];
      if (state.estacionNombre) parts.push(state.estacionNombre);
      if (state.estacionID) parts.push('Estacion #' + state.estacionID);
      if (state.carritoCodigo) parts.push('Carrito ' + state.carritoCodigo);
      document.getElementById('cartElectricMeta').textContent = parts.join(' | ') || 'Estacion no detectada';
    }

    function estadoInfo(rele) {
      const raw = normalize(rele && rele.ultimo_estado).toLowerCase();
      if (raw === 'on' || raw === 'encendido') return { label: 'Encendido', cls: 'is-on' };
      if (raw === 'off' || raw === 'apagado') return { label: 'Apagado', cls: 'is-off' };
      if (normalize(rele && rele.ultimo_error)) return { label: 'Error', cls: 'is-error' };
      return { label: 'Sin estado', cls: 'is-off' };
    }

    function controlLabel(rele, isOn) {
      if (rele && rele.programacion_habilitada) {
        return isOn ? 'Apagar (programado)' : 'Encender (programado)';
      }
      return isOn ? 'Apagar' : 'Encender';
    }

    function scheduleLabel(rele) {
      if (!rele || !rele.programacion_habilitada) return 'Sin programacion';
      if (normalize(rele.programacion_inicio) || normalize(rele.programacion_fin)) {
        return 'Encendido ' + (normalize(rele.programacion_inicio) || '--') + ' | Apagado ' + (normalize(rele.programacion_fin) || '--');
      }
      const on = normalize(rele.hora_encendido) || '--:--';
      const off = normalize(rele.hora_apagado) || '--:--';
      const days = normalize(rele.programacion_dias) || 'todos';
      return 'ON ' + on + ' | OFF ' + off + ' | ' + days;
    }

    function scheduleState(rele) {
      if (!rele || !rele.programacion_habilitada) return null;
      const startRaw = normalize(rele.programacion_inicio);
      const endRaw = normalize(rele.programacion_fin);
      const start = parseDate(startRaw);
      const end = parseDate(endRaw);
      const now = new Date();
      if (start && end) {
        const running = now >= start && now < end;
        return { running: running, text: running ? 'Programado · Funcionando ahora' : 'Programado · En espera', detail: startRaw.replace('T', ' ') + ' — ' + endRaw.replace('T', ' ') };
      }
      const on = normalize(rele.hora_encendido);
      const off = normalize(rele.hora_apagado);
      if (!/^\d{2}:\d{2}$/.test(on) || !/^\d{2}:\d{2}$/.test(off)) return { running: false, text: 'Programado · En espera', detail: '' };
      const minutes = now.getHours() * 60 + now.getMinutes();
      const toMinutes = function(value) { const parts = value.split(':').map(Number); return parts[0] * 60 + parts[1]; };
      const onMinutes = toMinutes(on), offMinutes = toMinutes(off);
      const running = onMinutes === offMinutes ? false : (onMinutes < offMinutes ? minutes >= onMinutes && minutes < offMinutes : minutes >= onMinutes || minutes < offMinutes);
      return { running: running, text: running ? 'Programado · Funcionando ahora' : 'Programado · En espera', detail: on + ' — ' + off };
    }

    function photoHTML(rele) {
      const url = normalize(rele && rele.imagen_url);
      if (!url) {
        return '<div class="device-photo device-photo-empty">Sin foto</div>';
      }
      return '<img class="device-photo" src="' + escapeHtml(url) + '" alt="' + escapeHtml(rele.relay_name || rele.tipo_carga || 'Aparato') + '" loading="lazy">';
    }

    function parseDate(raw) {
      const text = normalize(raw);
      if (!text) return null;
      let iso = text.indexOf('T') >= 0 ? text : text.replace(' ', 'T');
      // PostgreSQL puede entregar seis dígitos de microsegundos; ECMAScript
      // acepta como máximo tres dígitos de milisegundos.
      iso = iso.replace(/(\.\d{3})\d+(?=(Z|[+-]\d{2}(?::?\d{2})?)$)/, '$1');
      iso = iso.replace(/([+-]\d{2})$/, '$1:00');
      const date = new Date(iso);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function raspberryOnline(item) {
      if (!item || !item.tunnel_enabled) return false;
      const status = normalize(item.tunnel_status).toLowerCase();
      if (status !== 'connected' && status !== 'online' && status !== 'conectado') return false;
      const seen = parseDate(item.last_seen);
      return !!seen && (Date.now() - seen.getTime()) <= 90000;
    }

    function raspberryLabel(id) {
      const item = state.raspberryPIs.find(function(pi) { return Number(pi && pi.id) === Number(id || 0); });
      return item ? (normalize(item.nombre) || normalize(item.codigo) || ('Raspberry #' + id)) : (id ? ('Raspberry #' + id) : 'Raspberry no asignada');
    }

    function relayRaspberryConnected(rele) {
      const raspberryID = Number(rele && rele.raspberry_id || 0);
      const item = state.raspberryPIs.find(function(pi) { return Number(pi && pi.id) === raspberryID; });
      return raspberryOnline(item);
    }

    function explainDisconnectedRelay(rele, action) {
      const device = normalize(rele && (rele.relay_name || rele.tipo_carga)) || 'este equipo';
      const raspberry = raspberryLabel(rele && rele.raspberry_id);
      const operation = normalize(action) || 'controlarlo';
      setMessage('No se puede ' + operation + ' ' + device + ' porque ' + raspberry + ' está desconectada. Verifica energía, Wi-Fi o Internet de la Raspberry y espera a que el túnel se reconecte.', 'error');
      return false;
    }

    function raspberryStatusHTML(id) {
      const item = state.raspberryPIs.find(function(pi) { return Number(pi && pi.id) === Number(id || 0); });
      const online = raspberryOnline(item);
      const label = online ? 'Raspberry conectada' : 'Raspberry desconectada';
      return '<span class="raspberry-connection ' + (online ? 'is-online' : 'is-offline') + '" title="' + escapeHtml(label) + '"><span class="raspberry-connection-dot" aria-hidden="true"></span>' + escapeHtml(label) + '</span>';
    }

    function renderControllers() {
      const box = document.getElementById('cartElectricControllerSummary');
      const rows = Array.isArray(state.raspberryPIs) ? state.raspberryPIs : [];
      const online = rows.filter(raspberryOnline).length;
      document.getElementById('cartElectricControllers').textContent = online + (online === 1 ? ' conectada' : ' conectadas');
      if (!box) return;
      if (!rows.length) {
        box.innerHTML = '<span class="controller-chip">Sin Raspberry registradas</span>';
        return;
      }
      box.innerHTML = rows.map(function(pi) {
        const connected = raspberryOnline(pi);
        const label = normalize(pi.nombre) || normalize(pi.codigo) || ('Raspberry #' + pi.id);
        return '<span class="controller-chip' + (connected ? ' is-online' : '') + '" title="' + escapeHtml(connected ? 'Tunel conectado' : 'Sin conexion reciente') + '">' + escapeHtml(label) + ': ' + (connected ? 'conectada' : 'desconectada') + '</span>';
      }).join('');
    }

    function lastSensorEvent(sensor) {
      const raspberryID = Number(sensor && sensor.raspberry_id || 0);
      const gpio = Number(sensor && sensor.entrada_gpio_pin);
      return (Array.isArray(state.eventos) ? state.eventos : []).find(function(evento) {
        return normalize(evento && evento.comando).toLowerCase() === 'sensor_input' &&
          Number(evento && evento.raspberry_id || 0) === raspberryID &&
          Number(evento && evento.gpio_pin) === gpio;
      }) || null;
    }

    function sensorCardHTML(sensor) {
      const event = lastSensorEvent(sensor);
      const value = event ? normalize(event.estado_objetivo) : '';
      const activeValues = ['1', 'true', 'on', 'active', 'open', 'abierto', 'encendido', 'activo'];
      const active = activeValues.indexOf(value.toLowerCase()) >= 0;
      const statusLabel = event ? (active ? 'Señal activa' : 'Señal inactiva') : 'Sin lectura reciente';
      const name = normalize(sensor.nombre) || normalize(sensor.sensor_codigo) || ('Sensor GPIO ' + sensor.entrada_gpio_pin);
      return '<article class="sensor-card' + (active ? ' is-active' : '') + '">' +
        '<div class="device-title-row"><div class="device-title"><strong title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</strong><small>Entrada / sensor</small></div>' +
        '<span class="status-pill ' + (active ? 'is-on' : 'is-off') + '">' + escapeHtml(statusLabel) + '</span></div>' +
        '<div class="device-details">' +
          '<span>GPIO ' + escapeHtml(sensor.entrada_gpio_pin) + ' | ' + escapeHtml(raspberryLabel(sensor.raspberry_id)) + '</span>' +
          '<span>Pull: ' + escapeHtml(sensor.entrada_pull || 'none') + ' | Debounce: ' + escapeHtml(sensor.debounce_ms || 250) + ' ms</span>' +
          '<span>Accion: ' + escapeHtml(sensor.accion || 'alarma') + '</span>' +
          (event && event.fecha_evento ? '<span>Ultima señal: ' + escapeHtml(event.fecha_evento) + '</span>' : '') +
        '</div></article>';
    }

    function render() {
      const grid = document.getElementById('cartElectricGrid');
      const cfg = state.config || {};
      const reles = (Array.isArray(state.reles) ? state.reles : []).filter(function(rele) { return !state.stationFilterID || Number(rele.estacion_id) === state.stationFilterID; });
      const sensores = (Array.isArray(state.sensores) ? state.sensores : []).filter(function(sensor) { return !state.stationFilterID || Number(sensor.estacion_id) === state.stationFilterID; });
      const total = reles.length;
      const onCount = reles.filter(function(rele) {
        const raw = normalize(rele.ultimo_estado).toLowerCase();
        return raw === 'on' || raw === 'encendido';
      }).length;
      const scheduled = reles.filter(function(rele) { return !!rele.programacion_habilitada; }).length;

      document.getElementById('cartElectricTotalDevices').textContent = String(total);
      document.getElementById('cartElectricOnDevices').textContent = String(onCount);
      document.getElementById('cartElectricScheduledDevices').textContent = String(scheduled);
      document.getElementById('cartElectricSensors').textContent = String(sensores.length);
      renderControllers();

      if (!cfg.habilitado) {
        grid.innerHTML = '<div class="alert">El modulo de domotica no esta activo para esta empresa.</div>';
        return;
      }
      if (!reles.length && !sensores.length) {
        grid.innerHTML = '<div class="alert">No hay equipos ni sensores configurados para la selección actual.</div>';
        return;
      }

      const devicesHTML = reles.slice().sort(function(a, b) {
        return normalize(a && a.categoria || 'Sin categoria').localeCompare(normalize(b && b.categoria || 'Sin categoria'), 'es');
      }).map(function(rele) {
        const info = estadoInfo(rele);
        const timer = timerInfo(rele.id);
        const schedule = scheduleState(rele);
        // Mientras el temporizador esta activo tiene prioridad visual sobre el
        // ultimo heartbeat: el equipo fue ordenado a encenderse y el control
        // principal debe ofrecer apagarlo de inmediato.
        const isOn = info.cls === 'is-on' || timer.active;
        const disabled = state.sendingID === Number(rele.id) || !cfg.habilitado;
        const hasPhoto = !!normalize(rele.imagen_url);
        return '<article class="device-card' + (isOn ? ' is-on' : '') + '">' +
          '<div class="device-body">' +
            '<div class="device-title-row">' +
              '<div class="device-title">' +
                '<strong title="' + escapeHtml(rele.relay_name || rele.tipo_carga || 'Aparato') + '">' + escapeHtml(rele.relay_name || rele.tipo_carga || 'Aparato') + '</strong>' +
                '<small>' + escapeHtml(rele.categoria || rele.tipo_carga || rele.salida_codigo || 'Sin categoria') + '</small>' +
				(schedule ? '<span class="device-schedule-state' + (schedule.running ? ' is-running' : '') + '" title="' + escapeHtml(schedule.detail || scheduleLabel(rele)) + '">' + escapeHtml(schedule.text) + (schedule.detail ? ' · ' + escapeHtml(schedule.detail) : '') + '</span>' : '') +
              '</div>' +
              (isOn ? '<span class="electric-on-bolt" title="Salida activa" aria-label="Salida activa">⚡</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="device-footer' + (hasPhoto ? ' has-photo' : '') + '">' +
            '<button class="btn device-toggle-action ' + info.cls + '" type="button" data-control-toggle="' + (isOn ? 'off' : 'on') + '" data-rele-id="' + escapeHtml(rele.id || 0) + '" title="' + escapeHtml(controlLabel(rele, isOn)) + '"' + (disabled ? ' disabled' : '') + '>' + escapeHtml(controlLabel(rele, isOn)) + '</button>' +
            '<button class="btn secondary" type="button" data-control-schedule data-rele-id="' + escapeHtml(rele.id || 0) + '">Programar</button>' +
			'<button class="btn secondary" type="button" data-control-timer data-rele-id="' + escapeHtml(rele.id || 0) + '">' + timerText(rele.id) + '</button>' +
            (hasPhoto ? photoHTML(rele) : '') +
          '</div>' +
        '</article>';
      }).join('');
      const sensorsHTML = sensores.map(sensorCardHTML).join('');
      grid.innerHTML = devicesHTML + sensorsHTML;
    }

    // En móvil no se reemplaza el grid cada segundo: esa reconstrucción podía
    // cancelar un toque justo antes del click y dejar la vista bajo el menú
    // flotante. Solo se actualiza el texto vivo del temporizador; el estado
    // completo sigue refrescándose al confirmar el comando o al pulsar Actualizar.
    function refreshLiveTimerLabels() {
      const grid = document.getElementById('cartElectricGrid');
      if (!grid) return;
      grid.querySelectorAll('[data-control-timer][data-rele-id]').forEach(function(button) {
        button.textContent = timerText(button.getAttribute('data-rele-id'));
      });
    }

    async function ensureOk(res) {
      if (res && res.ok) return;
      let text = '';
      try {
        text = await res.text();
      } catch (_) {}
      throw new Error(text || 'No se pudo completar la solicitud.');
    }

    async function fetchControls(silent) {
      if (!state.empresaID || (!state.allStations && !state.estacionID)) {
        setMessage('No se pudo identificar la empresa o la estación.', 'error');
        render();
        return;
      }
      if (!silent) setMessage('Cargando aparatos...', '');
      if (state.allStations) {
        const base = '/api/empresa/control_electrico?empresa_id=' + encodeURIComponent(state.empresaID) + '&action=';
        const responses = await Promise.all(['config', 'reles', 'reglas', 'eventos', 'raspberry_pis'].map(function(action) {
          return fetch(base + action, { credentials: 'same-origin' }).then(async function(res) { await ensureOk(res); return res.json(); });
        }));
        state.config = responses[0] || {};
        state.reles = Array.isArray(responses[1]) ? responses[1] : [];
        state.sensores = Array.isArray(responses[2]) ? responses[2] : [];
        state.eventos = Array.isArray(responses[3]) ? responses[3] : [];
        state.raspberryPIs = Array.isArray(responses[4]) ? responses[4] : [];
        populateStationFilter();
        if (!silent) setMessage('', '');
        render();
        return;
      }
      const url = new URL('/api/empresa/control_electrico', window.location.origin);
      url.searchParams.set('empresa_id', String(state.empresaID));
      url.searchParams.set('action', 'estacion_controls');
      url.searchParams.set('estacion_id', String(state.estacionID));
      const res = await fetch(url.pathname + url.search, { credentials: 'same-origin' });
      await ensureOk(res);
      const payload = await res.json();
      state.config = payload.config || {};
      state.reles = Array.isArray(payload.reles) ? payload.reles : [];
      state.sensores = Array.isArray(payload.sensores) ? payload.sensores : [];
      state.eventos = Array.isArray(payload.eventos) ? payload.eventos : [];
      state.raspberryPIs = Array.isArray(payload.raspberry_pis) ? payload.raspberry_pis : [];
      if (!silent) setMessage('', '');
      render();
    }

    function relayStateMatches(releID, estado) {
      const rele = state.reles.find(function(item) { return Number(item.id) === Number(releID); });
      if (!rele) return false;
      const current = normalize(rele.ultimo_estado).toLowerCase();
      if (estado === 'on') return current === 'on' || current === 'encendido';
      return current === 'off' || current === 'apagado';
    }

    async function waitForRelayConfirmation(releID, estado) {
      for (let attempt = 0; attempt < 12; attempt += 1) {
        await new Promise(function(resolve) { window.setTimeout(resolve, 1500); });
        await fetchControls(true);
        if (relayStateMatches(releID, estado)) return true;
      }
      return false;
    }

    async function sendCommand(releID, estado) {
      const id = parsePositiveInt(releID);
      if (!id) {
        setMessage('Selecciona un aparato valido.', 'error');
        return;
      }
        const rele = state.reles.find(function(item) { return Number(item.id) === id; }) || {};
        if (!relayRaspberryConnected(rele)) {
          explainDisconnectedRelay(rele, estado === 'on' ? 'encender' : 'apagar');
          return;
        }
      try {
		if (estado === 'off' && state.timers[String(id)]) { delete state.timers[String(id)]; localStorage.setItem('pcsDomoticaTimers', JSON.stringify(state.timers)); }
        state.sendingID = id;
        setMessage(estado === 'on' ? 'Encendiendo aparato...' : 'Apagando aparato...', '');
        render();
        const url = '/api/empresa/control_electrico?empresa_id=' + encodeURIComponent(state.empresaID) + '&action=probar_rele';
        const res = await fetch(url, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ estacion_id: Number(rele.estacion_id || state.estacionID || 0), rele_id: id, estado: estado })
        });
        await ensureOk(res);
        const result = await res.json();
        if (result && result.skipped) {
          await fetchControls(true);
          setMessage(result.message || 'Comando omitido.', 'error');
          return;
        }
        if (result && result.pending) {
          setMessage('Comando enviado; esperando confirmación de la Raspberry...', '');
          const confirmed = await waitForRelayConfirmation(id, estado);
          setMessage(confirmed ? (estado === 'on' ? 'Aparato encendido.' : 'Aparato apagado.') : 'El comando sigue en cola. Revisa la conexión de la Raspberry.', confirmed ? 'success' : 'error');
          return;
        }
        await fetchControls(true);
        const confirmed = relayStateMatches(id, estado);
        setMessage(confirmed ? (estado === 'on' ? 'Aparato encendido.' : 'Aparato apagado.') : 'La Raspberry respondió, pero el estado todavía no se actualizó.', confirmed ? 'success' : 'error');
      } catch (err) {
        setMessage(err.message || 'No se pudo enviar el comando electrico.', 'error');
      } finally {
        state.sendingID = 0;
        render();
      }
    }

    function openSchedule(releID) {
      const rele = state.reles.find(function(item) { return Number(item.id) === Number(releID); });
      if (!rele) return;
      state.selectedReleID = Number(releID);
      document.getElementById('cartElectricScheduleTitle').textContent = rele.relay_name || 'Equipo';
      document.getElementById('cartElectricScheduleEnabled').checked = !!rele.programacion_habilitada;
      const now = new Date();
      now.setSeconds(0, 0);
      const defaultOn = new Date(now.getTime() + 5 * 60 * 1000);
      const defaultOff = new Date(defaultOn.getTime() + 60 * 60 * 1000);
      document.getElementById('cartElectricScheduleOn').value = normalize(rele.programacion_inicio) || scheduleDateTimeValue(rele.hora_encendido, defaultOn);
      document.getElementById('cartElectricScheduleOff').value = normalize(rele.programacion_fin) || scheduleDateTimeValue(rele.hora_apagado, defaultOff, rele.hora_encendido);
      document.getElementById('cartElectricScheduleDays').value = rele.programacion_dias || 'todos';
      document.getElementById('cartElectricScheduleDialog').showModal();
    }

    function populateStationFilter() {
      const wrap = document.getElementById('cartElectricStationFilterWrap');
      const select = document.getElementById('cartElectricStationFilter');
      if (!wrap || !select || !state.allStations) return;
      const stations = {};
      state.reles.forEach(function(rele) {
        const id = Number(rele.estacion_id || 0);
        if (id) stations[id] = normalize(rele.estacion_nombre) || ('Estación #' + id);
      });
      const selected = String(state.stationFilterID || 0);
      select.innerHTML = '<option value="0">Todas las estaciones</option>' + Object.keys(stations).sort(function(a, b) { return Number(a) - Number(b); }).map(function(id) { return '<option value="' + escapeHtml(id) + '">' + escapeHtml(stations[id]) + '</option>'; }).join('');
      select.value = selected;
      wrap.hidden = false;
    }

    function localDateTimeValue(date) {
      const pad = function(value) { return String(value).padStart(2, '0'); };
      return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
    }

    function scheduleDateTimeValue(hour, fallback, onHour) {
      const value = normalize(hour);
      if (!/^\d{2}:\d{2}$/.test(value)) return localDateTimeValue(fallback);
      const date = new Date(fallback.getTime());
      const [hours, minutes] = value.split(':').map(Number);
      date.setHours(hours, minutes, 0, 0);
      if (onHour && /^\d{2}:\d{2}$/.test(normalize(onHour)) && value <= normalize(onHour)) date.setDate(date.getDate() + 1);
      return localDateTimeValue(date);
    }

    async function saveSchedule() {
      const rele = state.reles.find(function(item) { return Number(item.id) === state.selectedReleID; });
      if (!rele) return;
      const enabled = document.getElementById('cartElectricScheduleEnabled').checked;
      const on = document.getElementById('cartElectricScheduleOn').value;
      const off = document.getElementById('cartElectricScheduleOff').value;
      if (enabled && (!on || !off || on >= off)) throw new Error('Indica una fecha y hora de encendido anteriores al apagado.');
      const payload = Object.assign({}, rele, {
        programacion_habilitada: enabled,
        programacion_inicio: enabled ? on : '',
        programacion_fin: enabled ? off : '',
        hora_encendido: enabled ? on.slice(11, 16) : '',
        hora_apagado: enabled ? off.slice(11, 16) : '',
        programacion_dias: enabled ? 'todos' : document.getElementById('cartElectricScheduleDays').value,
        programacion_timezone: rele.programacion_timezone || 'America/Bogota'
      });
      const url = '/api/empresa/control_electrico?empresa_id=' + encodeURIComponent(state.empresaID) + '&action=rele';
      const res = await fetch(url, { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      await ensureOk(res);
      document.getElementById('cartElectricScheduleDialog').close();
      await fetchControls();
      setMessage('Programación guardada.', 'success');
    }

    function bootstrap() {
      const params = new URLSearchParams(window.location.search || '');
      state.empresaID = parsePositiveInt(params.get('empresa_id') || params.get('id')) || (typeof window.__resolveEmpresaIdContext === 'function' ? parsePositiveInt(window.__resolveEmpresaIdContext()) : 0);
      state.estacionID = parsePositiveInt(params.get('estacion_id'));
      state.allStations = normalize(params.get('vista') || params.get('mode')).toLowerCase() === 'todas';
      state.stationFilterID = parsePositiveInt(params.get('filtro_estacion'));
      state.estacionNombre = normalize(params.get('estacion_nombre'));
      state.carritoID = parsePositiveInt(params.get('carrito_id'));
      state.carritoCodigo = normalize(params.get('carrito_codigo'));
      state.returnTo = normalize(params.get('return_to') || params.get('source')).toLowerCase();
      setMeta();
      render();

      const backBtn = document.getElementById('cartElectricBackBtn');
      backBtn.textContent = state.returnTo === 'admin' ? 'Volver al panel' : (state.returnTo === 'estaciones' ? 'Volver a estaciones' : 'Volver al carrito');

      if (state.allStations) {
        document.title = 'Equipos electrónicos de Domótica';
        document.querySelector('.cart-electric-header h1').innerHTML = '<span aria-hidden="true">⚡</span> Equipos electrónicos de Domótica';
      }

      backBtn.addEventListener('click', function() {
        window.location.href = buildBackURL();
      });
      document.getElementById('cartElectricRefreshBtn').addEventListener('click', function() {
        fetchControls().catch(function(err) {
          setMessage(err.message || 'No se pudieron cargar aparatos.', 'error');
        });
      });
      document.getElementById('cartElectricStationFilter').addEventListener('change', function(ev) {
        state.stationFilterID = parsePositiveInt(ev.target.value);
        render();
      });
      document.getElementById('cartElectricGrid').addEventListener('click', function(ev) {
        const schedule = ev.target && ev.target.closest ? ev.target.closest('[data-control-schedule]') : null;
        if (schedule) { openSchedule(schedule.getAttribute('data-rele-id')); return; }
		const timer = ev.target && ev.target.closest ? ev.target.closest('[data-control-timer]') : null;
        if (timer) {
          state.selectedReleID = parsePositiveInt(timer.getAttribute('data-rele-id'));
          const r = state.reles.find(function(item) { return Number(item.id) === state.selectedReleID; });
          if (!relayRaspberryConnected(r)) {
            explainDisconnectedRelay(r, 'iniciar el temporizador de');
            return;
          }
          document.getElementById('cartElectricTimerTitle').textContent = (r && r.relay_name) || 'Equipo';
          document.getElementById('cartElectricTimerDialog').showModal();
          return;
        }
        const toggle = ev.target && ev.target.closest ? ev.target.closest('[data-control-toggle]') : null;
        if (toggle) { sendCommand(toggle.getAttribute('data-rele-id'), toggle.getAttribute('data-control-toggle')); return; }
      });
      document.getElementById('cartElectricScheduleForm').addEventListener('submit', function(ev) { ev.preventDefault(); saveSchedule().catch(function(err) { setMessage(err.message || 'No se pudo guardar programación.', 'error'); }); });
		document.getElementById('cartElectricTimerForm').addEventListener('click', function(ev){const p=ev.target.closest('[data-timer-preset]');if(!p)return;const n=Number(p.getAttribute('data-timer-preset'));document.getElementById('cartElectricTimerHours').value=Math.floor(n/3600);document.getElementById('cartElectricTimerMinutes').value=Math.floor(n%3600/60);document.getElementById('cartElectricTimerSeconds').value=n%60;});
        document.getElementById('cartElectricTimerForm').addEventListener('submit', async function(ev) { ev.preventDefault(); const sec=Number(document.getElementById('cartElectricTimerHours').value||0)*3600+Number(document.getElementById('cartElectricTimerMinutes').value||0)*60+Number(document.getElementById('cartElectricTimerSeconds').value||0); if(sec<1) throw new Error('Indica una duración válida.'); const rele=state.reles.find(x=>Number(x.id)===state.selectedReleID)||{}; if(!relayRaspberryConnected(rele)){explainDisconnectedRelay(rele,'iniciar el temporizador de');return;} const res=await fetch('/api/empresa/control_electrico?empresa_id='+encodeURIComponent(state.empresaID)+'&action=temporizador_rele',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({estacion_id:Number(rele.estacion_id||state.estacionID||0),rele_id:state.selectedReleID,duracion_segundos:sec})}); await ensureOk(res); rele.ultimo_estado='on'; state.timers[String(state.selectedReleID)]=Date.now()+sec*1000;localStorage.setItem('pcsDomoticaTimers',JSON.stringify(state.timers));document.getElementById('cartElectricTimerDialog').close(); render(); await fetchControls(); setMessage('Temporizador iniciado; el equipo quedara encendido hasta finalizar.','success'); });
		setInterval(function(){ if(Object.keys(state.timers).length) refreshLiveTimerLabels(); },1000);

      fetchControls().catch(function(err) {
        setMessage(err.message || 'No se pudieron cargar aparatos.', 'error');
      });
    }

    bootstrap();
  </script>
</body>
</html>
